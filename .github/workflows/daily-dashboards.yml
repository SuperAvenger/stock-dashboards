name: Daily Stock Dashboards

on:
  schedule:
    # 周一至周五，每天 8:30 + 17:00 北京时间 (UTC 0:30 + 9:00)
    - cron: '30 0,9 * * 1-5'
  workflow_dispatch:

jobs:
  generate-dashboards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests longport beautifulsoup4 lxml deep-translator

      - name: Restore previous push state
        run: |
          # 从 gh-pages 拉取上次的推送状态（如果存在）
          mkdir -p output
          if ! curl -fsSL -o output/push-state.json \
            "https://SuperAvenger.github.io/stock-dashboards/push-state.json"; then
            echo '{"hk":{},"us":{}}' > output/push-state.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_file = Path("output/push-state.json")
          try:
              json.loads(state_file.read_text(encoding="utf-8"))
          except Exception:
              state_file.write_text('{"hk":{},"us":{}}', encoding="utf-8")
          PY
          echo "📋 已恢复推送状态:"
          cat output/push-state.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  港股: {len(d.get(\"hk\",{}))} 只 | 美股: {len(d.get(\"us\",{}))} 只')"

      - name: Generate HK Dashboard (Pro Version)
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN }}
        run: python scripts/dashboard_static_generator.py

      - name: Generate US Dashboard (Pro Version)
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN }}
        run: python scripts/dashboard_generator_us.py

      - name: Push to Feishu (smart dedup)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/push_to_feishu.py

      - name: AI News Daily (with translation)
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/ai_news_daily.py

      - name: Upload output to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: generate-dashboards
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
